<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Xen Live View</title>
<style>
:root{--bg:#0e1014;--card:#171a21;--line:#262b35;--text:#e6e8ec;--dim:#8b93a3;--ok:#5fd38d;--warn:#f2b84b;--bad:#ef6a6a;--acc:#7aa7ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
header h1{font-size:16px;margin:0;font-weight:600}.live{display:inline-flex;align-items:center;gap:6px;color:var(--dim);font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--bad);animation:p 1.2s infinite}@keyframes p{50%{opacity:.35}}
.tabs{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}.tabs button{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer}
.tabs button.on{border-color:var(--acc);color:var(--acc)}
main{padding:16px;display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.view{position:relative;aspect-ratio:16/9;background:#000}.view img{width:100%;height:100%;display:block;image-rendering:pixelated}
.cross{position:absolute;left:50%;top:50%;width:14px;height:14px;transform:translate(-50%,-50%);pointer-events:none}
.cross:before,.cross:after{content:"";position:absolute;background:rgba(255,255,255,.75)}.cross:before{left:6px;top:0;width:2px;height:14px}.cross:after{top:6px;left:0;height:2px;width:14px}
.tag{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.55);padding:3px 8px;border-radius:6px;font-weight:600}
.age{position:absolute;right:8px;top:8px;background:rgba(0,0,0,.55);padding:3px 8px;border-radius:6px;font-size:12px;color:var(--dim)}
.hud{padding:10px 12px;display:grid;gap:8px}.row{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.k{color:var(--dim)}.bar{width:90px;height:8px;background:#2a2f3a;border-radius:4px;overflow:hidden;display:inline-block;vertical-align:middle}.bar i{display:block;height:100%}
.chip{background:#20242d;border:1px solid var(--line);border-radius:6px;padding:1px 7px;font-size:12px}.chip.e{border-color:#8a6cff;color:#c9b8ff}
.doing{font-weight:600}.log{font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;color:#b9c0cc;max-height:190px;overflow:auto;border-top:1px solid var(--line);padding:8px 12px;white-space:pre-wrap;word-break:break-word}
.empty{padding:40px 16px;color:var(--dim);text-align:center}
.note{color:var(--dim);font-size:12px;padding:0 16px 16px}
#exam{padding:0 16px 16px}#exam h2{font-size:15px;margin:8px 0 4px}#exam .sub{color:var(--dim);font-size:12px;margin-bottom:10px}
.qs{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));margin-bottom:12px}
.q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}.q b{display:block;margin-bottom:4px}
.q .n{font-variant-numeric:tabular-nums}.q .vs{color:var(--dim);font-size:12px}
.pics{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr))}
.pic{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}.pic img{width:100%;aspect-ratio:16/9;display:block;image-rendering:pixelated;background:#000}
.pic ul{list-style:none;margin:0;padding:6px 8px;font-size:12px}.pic li{display:flex;justify-content:space-between;gap:6px}
.right{color:var(--ok)}.wrong{color:var(--bad)}
.dream{display:flex;gap:10px;padding:10px 12px;border-top:1px solid var(--line);align-items:flex-start}.dream canvas{width:220px;height:160px;flex:none;background:#0b0d11;border:1px solid var(--line);border-radius:8px}
.dtxt{font-size:12px;display:grid;gap:6px;min-width:0}.dh{color:var(--acc);font-weight:600}.dopt{display:flex;flex-wrap:wrap;gap:2px 10px;opacity:.7}.dopt.pick{opacity:1}.dopt.pick b{color:#ffd166}
.pro{color:var(--ok)}.con{color:var(--bad)}
@media (max-width:520px){.dream{flex-direction:column}.dream canvas{width:100%;height:auto;aspect-ratio:11/8}}
</style></head><body>
<header><h1>Xen Live View</h1><span class="live"><span class="dot"></span>live, about 1 frame a second</span><div class="tabs" id="tabs"></div></header>
<main id="grid"><div class="empty">Waiting for the server to send a view…</div></main>
<section id="exam"></section>
<div class="note">What each Xen sees, drawn on the server from the real blocks and mobs in front of its eyes: block colours, the game's shading and light, no textures. ✦ = enchanted.</div>
<script>
const grid=document.getElementById('grid'),tabs=document.getElementById('tabs');let only=null,cards={};
function el(t,c,h){const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.textContent=h;return e}
function bar(v,max,col){const b=el('span','bar'),i=el('i');i.style.width=Math.max(0,Math.min(100,v/max*100))+'%';i.style.background=col;b.append(i);return b}
function chip(s){const c=el('span','chip'+(s.endsWith('*')?' e':''),s.replace(/\*$/,' ✦').replace(/_/g,' '));return c}
function card(n){const c=el('div','card'),v=el('div','view'),img=new Image();img.alt=n+"'s view";v.append(img,el('div','cross'),el('div','tag',n),el('div','age',''));
 const hud=el('div','hud'),log=el('div','log'),dr=el('div','dream'),cv=document.createElement('canvas'),dt=el('div','dtxt');cv.width=440;cv.height=320;dr.append(cv,dt);dr.style.display='none';
 c.append(v,hud,dr,log);grid.append(c);return cards[n]={c,img,hud,log,dr,cv,dt,age:v.querySelector('.age'),loading:false}}
function dream(k,s){const d=s.imagined;if(!d){k.dr.style.display='none';k.d=null;return}k.dr.style.display='';k.d=d;
 if(k.dAt===d.at)return;k.dAt=d.at;k.dt.replaceChildren(el('div','dh','imagined: '+d.decision+' at '+new Date(d.at).toLocaleTimeString()));
 d.options.forEach((o,i)=>{const r=el('div','dopt'+(i===d.pick?' pick':''));r.append(el('b','',(i===d.pick?'→ ':'')+o.name+' (~'+o.seconds+' s)'));
  o.pros.forEach(p=>r.append(el('span','pro','+ '+p)));o.cons.forEach(p=>r.append(el('span','con','− '+p)));k.dt.append(r)})}
function drawDream(k,t){const d=k.d,cv=k.cv;if(!d)return;const g=cv.getContext('2d'),W=cv.width,H=cv.height,pts=[[d.x,d.y,d.z]];
 d.options.forEach(o=>{pts.push(...o.way,o.to)});let x0=Math.min(...pts.map(p=>p[0])),x1=Math.max(...pts.map(p=>p[0])),z0=Math.min(...pts.map(p=>p[2])),z1=Math.max(...pts.map(p=>p[2]));
 const sc=Math.min((W-40)/Math.max(8,x1-x0),(H-40)/Math.max(8,z1-z0)),ox=(W-(x1-x0)*sc)/2,oz=(H-(z1-z0)*sc)/2,X=p=>ox+(p[0]-x0)*sc,Z=p=>oz+(p[2]-z0)*sc;
 g.clearRect(0,0,W,H);g.lineCap='round';g.lineJoin='round';
 d.options.forEach((o,i)=>{if(i===d.pick)return;g.setLineDash([6,6]);g.strokeStyle='#5b6578';g.lineWidth=2;g.beginPath();o.way.forEach((p,j)=>j?g.lineTo(X(p),Z(p)):g.moveTo(X(p),Z(p)));g.stroke();g.setLineDash([])});
 const pk=d.options[d.pick];g.strokeStyle='#ffd166';g.lineWidth=4;g.beginPath();pk.way.forEach((p,j)=>j?g.lineTo(X(p),Z(p)):g.moveTo(X(p),Z(p)));g.stroke();
 d.options.forEach((o,i)=>{g.fillStyle='#ef6a6a';o.trouble.forEach(p=>{g.beginPath();g.arc(X(p),Z(p),i===d.pick?6:4,0,7);g.fill()});
  g.fillStyle=i===d.pick?'#ff8a3d':'#9a5a3a';g.fillRect(X(o.to)-7,Z(o.to)-7,14,14);g.fillStyle='#e6e8ec';g.font='20px system-ui';g.fillText(String(i+1),X(o.to)+10,Z(o.to)+6)});
 g.fillStyle='#fff';g.beginPath();g.arc(X(pts[0]),Z(pts[0]),7,0,7);g.fill();
 const w=pk.way;if(w.length>1){const f=(t/4000)%1,e=f*(w.length-1),j=Math.floor(e),r=e-j,a=w[j],b=w[Math.min(j+1,w.length-1)];
  g.fillStyle='#7aa7ff';g.beginPath();g.arc(X(a)+(X(b)-X(a))*r,Z(a)+(Z(b)-Z(a))*r,8,0,7);g.fill()}}
(function anim(t){for(const n in cards)if(cards[n].d&&cards[n].c.style.display!=='none')drawDream(cards[n],t);requestAnimationFrame(anim)})(0);
function draw(n,s){const k=cards[n]||card(n);k.c.style.display=only&&only!==n?'none':'';
 if(!k.loading){k.loading=true;const im=new Image();im.onload=()=>{k.img.src=im.src;k.loading=false};im.onerror=()=>{k.loading=false};im.src=n+'.png?t='+s.at}
 const a=(Date.now()-s.at)/1000;k.age.textContent=a<3?'now':Math.round(a)+' s ago';
 k.hud.replaceChildren();const r1=el('div','row');
 r1.append(el('span','k','health'),bar(s.health,20,s.health>10?'var(--ok)':s.health>5?'var(--warn)':'var(--bad)'),el('span','',s.health+' / 20'),
  el('span','k','food'),bar(s.food,20,'#d39a5f'),el('span','',String(s.food)),el('span','k','levels'),el('span','',String(s.levels)),el('span','k','diamonds'),el('span','',String(s.diamonds)));
 const r2=el('div','row');r2.append(el('span','k','at'),el('span','',`${s.x}, ${s.y}, ${s.z} (${s.dimension}${s.night?', night':''})`));if(s.goal){r2.append(el('span','k','goal'),el('span','',s.goal))}
 const r3=el('div','row');r3.append(el('span','k','holding'),s.held?chip(s.held):el('span','k','nothing'),el('span','k','wearing'));(s.armor.length?s.armor:['nothing']).forEach(x=>r3.append(x==='nothing'?el('span','k','nothing'):chip(x)));
 const r4=el('div','row');r4.append(el('span','k','doing'),el('span','doing',s.doing));
 const r5=el('div','row');if(s.eyes){r5.append(el('span','k','eyes'),el('span','',s.eyes))}if(s.brain){r5.append(el('span','k','brain'),el('span','',s.brain))}const r6=el('div','row');if(s.plan){r6.append(el('span','k','plan'),el('span','',s.plan))}
 k.hud.append(r4,r6,r1,r2,r3,r5);dream(k,s);const atEnd=k.log.scrollTop+k.log.clientHeight>=k.log.scrollHeight-4;k.log.textContent=s.journal.join('\n')||'(nothing in its journal yet)';if(atEnd)k.log.scrollTop=k.log.scrollHeight}
function setTabs(names){if(tabs.dataset.n===names.join())return;tabs.dataset.n=names.join();tabs.replaceChildren();
 for(const n of [null,...names]){const b=el('button',only===n?'on':'',n||'All');b.onclick=()=>{only=n;[...tabs.children].forEach(x=>x.classList.toggle('on',x===b));for(const m in cards)cards[m].c.style.display=only&&only!==m?'none':''};tabs.append(b)}}
async function poll(){try{const r=await fetch('xens',{cache:'no-store'});const d=await r.json();const names=Object.keys(d);if(names.length){const e=grid.querySelector('.empty');if(e)e.remove()}
 setTabs(names);for(const n of names)draw(n,d[n])}catch(e){}setTimeout(poll,1000)}poll();
const pct=(a,b)=>b?Math.round(a/b*100)+'%':'–';
function exam(d){const x=document.getElementById('exam');if(!d||!d.heads){x.replaceChildren();return}x.replaceChildren();
 x.append(el('h2','',"Its eyes' exam (Xen Glance)"),el('div','sub','Each new picture is a test before it learns from it: what it guessed against what was really there. Balanced: the last 100 times each thing was there and the last 300 it wasn\'t, kept apart, so rare things count. '+(d.status||'')));
 const qs=el('div','qs');const bal=(c,t,f,n)=>t&&n?Math.round(((c/t)+(1-f/n))/2*100)+'%':'–';for(const h of d.heads){const q=el('div','q');q.append(el('b','',h.question+'?'));
  q.append(el('div','n',`balanced score ${bal(h.caught,h.there,h.falseAlarms,h.notThere)}`),el('div','vs',`the mod's own: ${bal(h.caughtMods,h.there,h.falseAlarmsMods,h.notThere)} (50% is guessing, 100% is perfect)`));
  q.append(el('div','n',`caught ${h.caught} of ${h.there} (${pct(h.caught,h.there)})`),el('div','vs',`the mod's own: ${h.caughtMods} (${pct(h.caughtMods,h.there)})`),
   el('div','n',`false alarms ${h.falseAlarms} of ${h.notThere} (${pct(h.falseAlarms,h.notThere)})`),el('div','vs',`the mod's own: ${h.falseAlarmsMods} (${pct(h.falseAlarmsMods,h.notThere)})`));qs.append(q)}
 x.append(qs);const ps=el('div','pics');const names=d.heads.map(h=>h.question);
 for(const p of [...(d.pictures||[])].reverse()){const c=el('div','pic'),im=new Image();im.src='data:image/png;base64,'+p.png;im.alt='what it saw';const ul=el('ul');
  names.forEach((nm,i)=>{const said=p.learned[i]>0.5,was=p.truth[i];if(!said&&!was)return;const li=el('li',said===was?'right':'wrong');
   li.append(el('span','',nm),el('span','',(was?'there':'not there')+', said '+Math.round(p.learned[i]*100)+'%'));ul.append(li)});
  if(!ul.children.length)ul.append(el('li','right','nothing there, said nothing'));c.append(im,ul);ps.append(c)}
 x.append(ps)}
async function pollExam(){try{const r=await fetch('exam',{cache:'no-store'});exam(await r.json())}catch(e){}setTimeout(pollExam,10000)}pollExam();
</script></body></html>
