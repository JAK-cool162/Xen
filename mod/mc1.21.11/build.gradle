plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

base { archivesName = 'xen-companion' }

sourceSets.main {
	java.srcDirs = ['../common/java', 'src/main/java']
	resources.srcDirs = ['../common/resources']
}

repositories {
	maven { url = "https://maven.terraformersmc.com/releases/" }   // Mod Menu (optional: its settings screen)
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	modLocalRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"   // only in test runs (./gradlew runClient)
	testImplementation "junit:junit:4.13.2"
}

processResources {
	def props = [version: project.version, minecraft: project.mc_range, java: project.java_version]
	inputs.properties props
	filesMatching("fabric.mod.json") { expand props }
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = Integer.parseInt(project.java_version)
	it.options.encoding = "UTF-8"   // the Thai words in the chat rules
}
java {
	sourceCompatibility = JavaVersion.toVersion(project.java_version)
	targetCompatibility = JavaVersion.toVersion(project.java_version)
}

// Java == Python: the mod's senses and brain against fixtures written by scripts/make_mod_fixtures.py
sourceSets {
	crossCheck {
		java.srcDirs = ['../common/test/java']
		compileClasspath += sourceSets.main.output + configurations.compileClasspath
		runtimeClasspath += sourceSets.main.output + configurations.runtimeClasspath
	}
}
tasks.register('crossCheck', JavaExec) {
	classpath = sourceSets.crossCheck.runtimeClasspath
	mainClass = 'xen.mod.core.CrossCheck'
	args file('../common/test/fixtures').absolutePath
}

// ./gradlew runClient -PuiTest: open Mod Menu and Xen's settings by themselves (for screenshots), then quit
loom {
	runs {
		client {
			if (project.hasProperty('uiTest')) vmArg '-Dxen.uiTest=true'
			if (project.hasProperty('recordTest')) vmArg "-Dxen.recordTest=${project.property('recordTest')}"   // -PrecordTest=90: the recorder by itself for 90 s
			if (project.hasProperty('recordFull')) vmArg '-Dxen.recordFull=true'   // -PrecordFull: that test recording with pictures
			if (project.hasProperty('gpuTest')) vmArg "-Dxen.gpuTest=${project.property('gpuTest')}"   // -PgpuTest=<model file>
			if (project.hasProperty('joinServer')) programArgs '--quickPlayMultiplayer', project.property('joinServer')   // -PjoinServer=localhost:25569
			if (project.hasProperty('clientName')) programArgs '--username', project.property('clientName')   // -PclientName=XenCam
			if (project.hasProperty('playWorld')) programArgs '--quickPlaySingleplayer', project.property('playWorld')   // -PplayWorld=xentest (a world in run/saves)
		}
	}
}

