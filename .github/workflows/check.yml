# Everything runs on both x86-64 and ARM64 (the chips in phones, Raspberry Pi, Apple Silicon): the Python tests and
# both mod builds with their Java == Python checks.
name: Check (x86-64 and ARM64)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Machine
        run: uname -m && nproc

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Python tests
        run: |
          pip install -r requirements.txt
          python -m unittest discover -s tests -t .

      - name: Mod for 1.21.11 (build, Java == Python)
        working-directory: mod/mc1.21.11
        run: ./gradlew build crossCheck --no-daemon

      - name: Mod for 26.x (build, Java == Python)
        working-directory: mod/mc26
        run: ./gradlew build crossCheck --no-daemon

      # The jar is built against 26.1.2 and runs on 26.1 - 26.3: it must also compile against the newest 26.x.
      - name: Mod for 26.x compiles against 26.3
        working-directory: mod/mc26
        run: ./gradlew compileJava -Pminecraft_version=26.3 -Pfabric_api_version=0.161.0+26.3 -Pmc_range=~26.3 --no-daemon

      # The jars this commit makes, kept a week (to try a build before a release).
      - name: Keep the jars
        uses: actions/upload-artifact@v4
        with:
          name: jars-${{ matrix.os }}
          path: |
            mod/mc1.21.11/build/libs/xen-companion-*.jar
            mod/mc26/build/libs/xen-companion-*.jar
          retention-days: 7
