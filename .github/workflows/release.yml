# Publishes a (pre-)release when a version tag is pushed (`git tag v0.3.0-alpha && git push origin v0.3.0-alpha`),
# or when started by hand with a tag name.
# Assets: the tested mod jars from dist/, Xen's trained brain (and the optional ones in brains/*.bin), the technical
# notes and the checksums.
name: Release

on:
  push:
    tags: ["v*"]
  # Or start it by hand (Actions -> Release -> Run workflow): it makes the tag on the commit it runs on, or on an older
  # commit given as "commit" (for a version that never got its release; it isn't marked Latest).
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to make and publish, e.g. v0.3.0-alpha"
        required: true
      commit:
        description: "Optional: an older commit to release (its dist/ jars and notes) instead of this one"
        required: false
        default: ""
      public:
        description: "yes: a full public release (marked Latest), even for an alpha or beta tag; for a tag already released, it's made public"
        required: false
        default: "no"
        type: choice
        options: ["no", "yes"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.sha }}

      - name: Xen's brain and checksums
        run: |
          cp mod/common/resources/assets/xen/brain.bin xen-brain.bin
          cp brains/*.bin . 2>/dev/null || true
          ls dist/TECHNICAL.txt 2>/dev/null > extra.txt || true
          sha256sum dist/*.jar xen-brain*.bin $(cat extra.txt) | sed 's| dist/| |' > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9][0-9A-Za-z.+-]*$ ]] || { echo "not a version tag: $TAG"; exit 1; }
          if [ "${{ inputs.public }}" = "yes" ] && gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --prerelease=false --latest   # (already out as a pre-release: now a public one)
            exit 0
          fi
          prerelease=""
          case "$TAG" in *alpha*|*beta*|*rc*|v0.*) prerelease="--prerelease" ;; esac
          [ "${{ inputs.public }}" = "yes" ] && prerelease=""
          latest=""
          if [ -n "${{ inputs.commit }}" ]; then
            # (the workflow's token can't tag an old commit with other workflow files, so the tag goes on this one)
            latest="--latest=false"
            printf '\n\n---\nPublished later: these files were built from commit %s (the tag is on a newer commit).\n' "$(git rev-parse --short HEAD)" >> dist/RELEASE_NOTES.md
          fi
          gh release create "$TAG" $prerelease $latest --target "$GITHUB_SHA" \
            --title "Xen Companion $TAG" \
            --notes-file dist/RELEASE_NOTES.md \
            dist/*.jar $(cat extra.txt) xen-brain*.bin SHA256SUMS.txt
