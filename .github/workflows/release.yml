# Publishes a (pre-)release when a version tag is pushed (`git tag v0.3.0-alpha && git push origin v0.3.0-alpha`),
# or when started by hand with a tag name.
# Assets: the tested mod jars from dist/, the same jars with the chat model inside (-with-chat, all in one), Xen's
# trained brain (and the optional ones in brains/*.bin), and the chat model (SmolLM2-360M-Instruct, Apache-2.0).
name: Release

on:
  push:
    tags: ["v*"]
  # Or start it by hand (Actions -> Release -> Run workflow): it makes the tag on the commit it runs on.
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to make and publish, e.g. v0.3.0-alpha"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Chat model (SmolLM2-360M-Instruct by Hugging Face, Apache-2.0)
        run: |
          curl -fL --retry 5 -o smollm2-360m-instruct-q8_0.gguf \
            https://huggingface.co/HuggingFaceTB/SmolLM2-360M-Instruct-GGUF/resolve/main/smollm2-360m-instruct-q8_0.gguf
          echo "48ab3034d0dd401fbc721eb1df3217902fee7dab9078992d66431f09b7750201  smollm2-360m-instruct-q8_0.gguf" | sha256sum -c

      - name: All-in-one jars (the mod with its chat model inside)
        run: for jar in dist/*.jar; do python3 scripts/bundle_chat_model.py "$jar" smollm2-360m-instruct-q8_0.gguf; done

      - name: Xen's brain and checksums
        run: |
          cp mod/common/resources/assets/xen/brain.bin xen-brain.bin
          cp brains/*.bin . 2>/dev/null || true
          sha256sum dist/*.jar xen-brain*.bin smollm2-360m-instruct-q8_0.gguf | sed 's| dist/| |' > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9][0-9A-Za-z.+-]*$ ]] || { echo "not a version tag: $TAG"; exit 1; }
          prerelease=""
          case "$TAG" in *alpha*|*beta*|*rc*|v0.*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" $prerelease --target "$GITHUB_SHA" \
            --title "Xen Companion $TAG" \
            --notes-file dist/RELEASE_NOTES.md \
            dist/*.jar xen-brain*.bin smollm2-360m-instruct-q8_0.gguf SHA256SUMS.txt
